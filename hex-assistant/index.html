<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>海克斯大乱斗助手 · Hex Brawl</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>⬢</text></svg>">
<style>
:root{
  --bg:#070a12; --bg2:#0d1220;
  --surface:#101827; --surface2:#161f33; --surface3:#1c2740;
  --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.14);
  --text:#e8edf7; --text2:#9aa7bd; --text3:#63718a;
  --prismatic:#c084fc; --gold:#fbbf24; --silver:#9fb0c7;
  --cyan:#22d3ee; --accent:#a855f7; --ok:#34d399;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:
    radial-gradient(1100px 560px at 12% -12%,rgba(88,28,135,.5) 0%,transparent 58%),
    radial-gradient(900px 480px at 102% -6%,rgba(8,80,100,.42) 0%,transparent 55%),
    linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%);
  color:var(--text);
  font-size:15px;
  overflow:hidden;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:6px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22);background-clip:padding-box}

.app{display:flex;height:100vh;overflow:hidden}

/* ══════════ 侧栏 ══════════ */
.sidebar{
  width:340px;flex-shrink:0;display:flex;flex-direction:column;
  border-right:1px solid var(--border);
  background:rgba(9,13,22,.72);
  backdrop-filter:blur(14px);
}
.brand{
  display:flex;align-items:center;gap:11px;
  padding:16px 18px 14px;border-bottom:1px solid var(--border);
}
.brand-mark{
  width:38px;height:38px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(140deg,#7c3aed,#a855f7 45%,#22d3ee);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;line-height:1;
  box-shadow:0 0 20px rgba(168,85,247,.45),inset 0 1px 0 rgba(255,255,255,.28);
}
.brand-txt h1{font-size:17px;font-weight:800;letter-spacing:.4px}
.brand-meta{display:flex;align-items:center;gap:6px;margin-top:3px}
.brand-meta .pill{
  font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;
  background:rgba(34,211,238,.14);color:var(--cyan);
  border:1px solid rgba(34,211,238,.28);letter-spacing:.3px;
}
.brand-meta .sub{font-size:11px;color:var(--text3)}

.search-wrap{padding:12px 14px 8px}
.search-box{position:relative}
.search-box input{
  width:100%;padding:10px 12px 10px 34px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:9px;color:var(--text);font-size:14px;outline:none;
  transition:border-color .16s,box-shadow .16s;
}
.search-box input::placeholder{color:var(--text3)}
.search-box input:focus{border-color:rgba(168,85,247,.65);box-shadow:0 0 0 3px rgba(168,85,247,.13)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none}

.role-row{display:flex;flex-wrap:wrap;gap:5px;padding:2px 14px 10px}
.role-chip{
  font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:6px;cursor:pointer;
  background:var(--surface);border:1px solid var(--border);color:var(--text2);
  transition:all .14s;user-select:none;
}
.role-chip:hover{color:var(--text);border-color:var(--border2)}
.role-chip.on{background:rgba(168,85,247,.18);border-color:rgba(168,85,247,.55);color:#d8b4fe}

.champ-list-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:2px 16px 8px;font-size:11.5px;color:var(--text3);
}
.champ-grid{
  flex:1;overflow-y:auto;padding:0 10px 16px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:6px;align-content:start;
}
.champ-item{
  position:relative;border-radius:9px;overflow:hidden;cursor:pointer;
  border:2px solid transparent;background:var(--surface2);
  aspect-ratio:1;transition:transform .13s,border-color .13s,box-shadow .13s;
}
.champ-item img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:1}
/* 图片未加载时的首字占位（避免大面积空白） */
.champ-item .cph{
  position:absolute;inset:0;z-index:0;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:rgba(255,255,255,.16);
  background:linear-gradient(140deg,#1e2b45,#141d2f);
}
.champ-item .cname{
  position:absolute;left:0;right:0;bottom:0;z-index:2;
  font-size:11px;font-weight:600;text-align:center;padding:3px 1px 2px;
  background:linear-gradient(transparent,rgba(0,0,0,.9) 55%);
  color:#e2e8f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:1.25;
}
.champ-item:hover{transform:translateY(-2px);border-color:var(--border2);z-index:2}
.champ-item.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(168,85,247,.22),0 0 16px rgba(168,85,247,.35)}
.champ-item.sel .cname{background:linear-gradient(transparent,rgba(120,53,180,.95))}

/* ══════════ 主区 ══════════ */
.content{flex:1;overflow-y:auto;position:relative}
.content-inner{max-width:1080px;margin:0 auto;padding:22px 30px 60px}

/* 空状态 */
.empty{
  height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;color:var(--text3);
  padding:40px;text-align:center;
}
.empty-mark{
  width:80px;height:80px;border-radius:22px;font-size:38px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(140deg,rgba(124,58,237,.22),rgba(34,211,238,.12));
  border:1px solid rgba(168,85,247,.3);
  box-shadow:0 0 44px rgba(168,85,247,.22);
}
.empty h2{font-size:19px;color:var(--text);font-weight:700}
.empty p{font-size:13.5px;line-height:1.7;max-width:420px}
.empty .hint{font-size:12.5px;color:var(--text3);margin-top:4px}

/* 英雄头部 */
.champ-hero{
  display:flex;align-items:center;gap:18px;
  padding:18px;border-radius:16px;margin-bottom:22px;
  background:linear-gradient(120deg,rgba(35,26,66,.85),rgba(17,24,39,.7));
  border:1px solid var(--border);position:relative;overflow:hidden;
}
.champ-hero::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(420px 200px at 88% 0%,rgba(168,85,247,.16),transparent 70%);
}
.portrait{
  width:84px;height:84px;border-radius:14px;flex-shrink:0;
  border:2px solid rgba(168,85,247,.55);
  box-shadow:0 0 26px rgba(168,85,247,.35);object-fit:cover;
}
.hero-info{flex:1;min-width:0;position:relative;z-index:1}
.hero-info h2{font-size:23px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.hero-title{font-size:13px;color:var(--text2);margin-top:3px}
.tag-row{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.tag{
  font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;
  background:rgba(34,211,238,.11);color:#67e8f9;border:1px solid rgba(34,211,238,.26);
  letter-spacing:.3px;
}
.hero-actions{display:flex;flex-direction:column;gap:7px;flex-shrink:0;position:relative;z-index:1}
.btn{
  padding:8px 14px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;
  border:1px solid var(--border2);background:var(--surface2);color:var(--text);
  transition:all .15s;white-space:nowrap;font-family:inherit;
}
.btn:hover{background:var(--surface3);border-color:rgba(168,85,247,.5)}
.btn.primary{
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  border-color:transparent;color:#fff;
  box-shadow:0 4px 16px rgba(124,58,237,.4);
}
.btn.primary:hover{filter:brightness(1.12)}

/* 区块标题 */
.sec-head{display:flex;align-items:center;gap:10px;margin:0 0 13px}
.sec-head h3{font-size:16px;font-weight:800;letter-spacing:.3px}
.sec-head .line{flex:1;height:1px;background:linear-gradient(90deg,var(--border2),transparent)}
.sec-head .badge{
  font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;
  background:rgba(148,163,184,.14);color:var(--text2);border:1px solid var(--border);
}
.sec{margin-bottom:26px}

/* 海克斯分组 */
.tier-group{margin-bottom:16px}
.tier-label{
  display:flex;align-items:center;gap:7px;
  font-size:12.5px;font-weight:800;letter-spacing:.6px;
  margin-bottom:9px;color:var(--text2);
}
.tier-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tier-label .cnt{font-size:11px;color:var(--text3);font-weight:600}

.hex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:9px}
.hex-card{
  display:flex;gap:11px;padding:11px 13px 11px 12px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;position:relative;overflow:hidden;
  transition:border-color .15s,background .15s,transform .15s;
}
.hex-card:hover{border-color:var(--border2);background:var(--surface2);transform:translateY(-1px)}
.hex-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.hex-card[data-tier=prismatic]::before{background:linear-gradient(180deg,#c084fc,#7c3aed)}
.hex-card[data-tier=gold]::before{background:linear-gradient(180deg,#fbbf24,#d97706)}
.hex-card[data-tier=silver]::before{background:linear-gradient(180deg,#cbd5e1,#64748b)}
.hex-main{flex:1;min-width:0}
.hex-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.hex-name{font-size:14.5px;font-weight:800;letter-spacing:.2px}
.rating{
  font-size:10px;font-weight:900;padding:1.5px 6px;border-radius:4px;letter-spacing:.3px;
}
.rating.r-sss{background:linear-gradient(135deg,#f43f5e,#ec4899);color:#fff;box-shadow:0 0 10px rgba(244,63,94,.5)}
.rating.r-s{background:rgba(52,211,153,.16);color:#6ee7b7;border:1px solid rgba(52,211,153,.34)}
.rating.r-a{background:rgba(96,165,250,.14);color:#93c5fd;border:1px solid rgba(96,165,250,.3)}
.rating.r-b{background:rgba(148,163,184,.13);color:var(--text2);border:1px solid var(--border)}
.hex-desc{font-size:12.5px;line-height:1.55;color:var(--text2);margin-top:5px}
.hex-why{
  font-size:11.5px;line-height:1.5;margin-top:6px;padding-top:6px;
  border-top:1px dashed rgba(255,255,255,.07);color:#a5b4cf;
  display:flex;gap:5px;align-items:flex-start;
}
.hex-why .ico{color:var(--cyan);flex-shrink:0;font-size:10px;margin-top:1px}
.hex-why.is-exclusive{color:#e9d5ff}
.hex-why.is-exclusive .ico{color:var(--prismatic)}

/* 出装 */
.build-wrap{display:flex;flex-direction:column;gap:11px}
.build-line{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;
}
.build-line-label{
  font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--text3);
  min-width:56px;flex-shrink:0;
}
.item{
  display:flex;flex-direction:column;align-items:center;gap:4px;width:52px;
  flex-shrink:0;
}
.item img{
  width:40px;height:40px;border-radius:7px;
  border:1px solid var(--border2);background:var(--surface2);object-fit:cover;
}
.item .ph{
  width:40px;height:40px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border2);background:var(--surface2);
  font-size:15px;color:var(--text3);
}
.item span{
  font-size:9.5px;line-height:1.2;text-align:center;color:var(--text2);
  max-width:52px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.item.core img{border-color:rgba(251,191,36,.55);box-shadow:0 0 10px rgba(251,191,36,.2)}
.arrow{color:var(--text3);font-size:12px;flex-shrink:0}

.build-tip{
  display:flex;gap:7px;align-items:flex-start;
  padding:10px 13px;border-radius:9px;font-size:12.5px;line-height:1.6;
  background:rgba(34,211,238,.07);border:1px solid rgba(34,211,238,.2);color:#a5f3fc;
}
.build-tip .ico{flex-shrink:0;font-size:11px;margin-top:2px}

/* 页脚 */
.foot{
  margin-top:34px;padding-top:16px;border-top:1px solid var(--border);
  font-size:11.5px;line-height:1.85;color:var(--text3);
}
.foot b{color:var(--text2);font-weight:700}
.foot .src{color:var(--text3)}

/* 加载 */
.loading{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:40px;color:var(--text2);font-size:13.5px;
}
.spinner{
  width:17px;height:17px;border-radius:50%;
  border:2px solid rgba(168,85,247,.25);border-top-color:var(--accent);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* 提示条 */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);
  padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;
  background:rgba(30,41,59,.96);border:1px solid var(--border2);color:var(--text);
  box-shadow:0 12px 34px rgba(0,0,0,.5);opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:99;backdrop-filter:blur(10px);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 响应式 */
@media (max-width:1000px){
  .hex-grid{grid-template-columns:1fr}
}
@media (max-width:820px){
  body{overflow:auto}
  .app{flex-direction:column;height:auto;min-height:100vh}
  .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--border);max-height:52vh}
  .champ-grid{grid-template-columns:repeat(6,1fr)}
  .content{overflow:visible}
  .empty{height:auto;padding:60px 24px}
  .content-inner{padding:18px 16px 50px}
  .champ-hero{flex-wrap:wrap}
  .hero-actions{flex-direction:row;width:100%}
}

/* ══════════ Electron 桌面模式 ══════════ */
body.electron{background:transparent;overflow:hidden}
body.electron .app{
  height:100vh;border-radius:13px;overflow:hidden;
  border:1px solid rgba(255,255,255,.11);
  background:
    radial-gradient(900px 420px at 10% -10%,rgba(88,28,135,.4) 0%,transparent 60%),
    radial-gradient(700px 380px at 100% 0%,rgba(8,80,100,.32) 0%,transparent 55%),
    linear-gradient(160deg,#070a12 0%,#0d1220 100%);
  box-shadow:0 22px 70px rgba(0,0,0,.6);
}

/* 标题栏：可拖拽移动窗口 + 状态 + 窗口控制 */
.titlebar{
  display:none;align-items:center;gap:9px;height:42px;flex-shrink:0;
  padding:0 8px 0 13px;background:rgba(11,16,26,.94);
  border-bottom:1px solid var(--border);
  -webkit-app-region:drag;user-select:none;
}
body.electron .titlebar{display:flex}

.tb-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.tb-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;background:#64748b;
  box-shadow:0 0 0 3px rgba(100,116,139,.14);transition:all .2s;
}
.tb-dot.on{background:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.18),0 0 10px rgba(52,211,153,.65)}
.tb-phase{font-size:12px;font-weight:700;color:var(--text2);white-space:nowrap;flex-shrink:0}
.tb-champ{
  display:none;font-size:11.5px;font-weight:800;color:#d8b4fe;
  padding:2.5px 8px;border-radius:5px;white-space:nowrap;
  background:rgba(168,85,247,.16);border:1px solid rgba(168,85,247,.34);
}
.tb-champ.show{display:inline-block}
.tb-msg{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

.tb-right{display:flex;align-items:center;gap:5px;-webkit-app-region:no-drag;flex-shrink:0}
.tb-btn{
  height:27px;padding:0 9px;border-radius:6px;cursor:pointer;
  border:1px solid var(--border);background:var(--surface2);color:var(--text2);
  font-size:11.5px;font-weight:700;font-family:inherit;
  display:inline-flex;align-items:center;gap:6px;transition:all .14s;white-space:nowrap;
}
.tb-btn:hover{background:var(--surface3);color:var(--text)}
.tb-btn.active{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.46);color:#6ee7b7}
.tb-btn.warn-active{background:rgba(251,191,36,.17);border-color:rgba(251,191,36,.48);color:#fcd34d}
.tb-icon{width:27px;padding:0;justify-content:center;font-size:13px}

.switch{
  position:relative;width:32px;height:17px;border-radius:9px;
  background:rgba(255,255,255,.15);transition:background .18s;flex-shrink:0;
}
.switch::after{
  content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;
  border-radius:50%;background:#94a3b8;transition:all .18s;
}
.switch.on{background:rgba(52,211,153,.42)}
.switch.on::after{left:17px;background:#34d399;box-shadow:0 0 8px rgba(52,211,153,.85)}

/* 穿透状态提示（穿透时点不到界面，只能看提示走热键） */
.ghost-hint{
  display:none;position:fixed;left:50%;bottom:13px;transform:translateX(-50%);
  padding:7px 15px;border-radius:8px;font-size:12px;font-weight:700;
  background:rgba(251,191,36,.18);border:1px solid rgba(251,191,36,.42);color:#fcd34d;
  z-index:99;pointer-events:none;white-space:nowrap;
}
body.electron.click-through .ghost-hint{display:block}
body.electron.click-through .app{border-color:rgba(251,191,36,.4)}
</style>
</head>
<body>
<!-- 桌面版标题栏（网页版自动隐藏） -->
<div class="titlebar" id="titlebar">
  <div class="tb-left">
    <span class="tb-dot" id="connDot"></span>
    <span class="tb-phase" id="tbPhase">未连接客户端</span>
    <span class="tb-champ" id="tbChamp"></span>
    <span class="tb-msg" id="tbMsg"></span>
  </div>
  <div class="tb-right">
    <button class="tb-btn" id="btnAutoAccept" title="自动接受对局（Ctrl+Shift+A 切换）">
      <span class="switch" id="autoAcceptSwitch"></span>
      <span>自动接受</span>
    </button>
    <button class="tb-btn" id="btnClickThrough" title="鼠标穿透，不挡游戏操作（Ctrl+Shift+H 切换）">穿透</button>
    <button class="tb-btn tb-icon" id="btnReconnect" title="重新连接客户端">⟳</button>
    <button class="tb-btn tb-icon" id="btnMin" title="最小化">—</button>
    <button class="tb-btn tb-icon" id="btnQuit" title="退出（Ctrl+Shift+Q）">✕</button>
  </div>
</div>
<div class="ghost-hint">鼠标穿透中 · Ctrl+Shift+H 恢复交互 · Ctrl+Shift+A 自动接受 · Ctrl+Shift+Q 退出</div>

<div class="app">
  <!-- 侧栏：英雄选择 -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">⬢</div>
      <div class="brand-txt">
        <h1>海克斯大乱斗助手</h1>
        <div class="brand-meta">
          <span class="pill" id="patchPill">26.21</span>
          <span class="sub" id="champCount">加载中…</span>
        </div>
      </div>
    </div>

    <div class="search-wrap">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input id="searchInput" type="text" placeholder="搜索英雄（中文 / 拼音首字母 / 英文）" autocomplete="off">
      </div>
    </div>

    <div class="role-row" id="roleRow"></div>

    <div class="champ-list-head">
      <span id="listHint">全部英雄</span>
      <span id="listCount"></span>
    </div>

    <div class="champ-grid" id="champGrid">
      <div class="loading" style="grid-column:1/-1"><span class="spinner"></span>正在加载英雄数据…</div>
    </div>
  </aside>

  <!-- 主区 -->
  <main class="content" id="content">
    <div class="empty" id="emptyState">

const PINYIN_HEAD = {};
Object.keys(PY_GROUPS).forEach(k => {
  for (const ch of PY_GROUPS[k]) PINYIN_HEAD[ch] = k;
});

function pinyinHead(name) {
  let out = '';
  for (const ch of name) {
    if (/[a-zA-Z0-9]/.test(ch)) out += ch.toLowerCase();
    else if (PINYIN_HEAD[ch]) out += PINYIN_HEAD[ch];
    else out += ch;
  }
  return out;
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 1900);
}

  if (!cid) { img.remove(); return; }
  if (!img.dataset.fb) {
    img.dataset.fb = '1';
    img.src = `${DDRAGON}/cdn/${ddVersion}/img/champion/${cid}.png`;
  } else {
    img.remove();
  }
}

/* ═══════════════════════════════════════════════════
   四、数据加载
   ═══════════════════════════════════════════════════ */
async function loadData() {
  // 1. 版本
  try {
    const r = await fetch(`${DDRAGON}/api/versions.json`, { cache:'force-cache' });
    if (r.ok) {
      const arr = await r.json();
      if (Array.isArray(arr) && arr[0]) ddVersion = arr[0];
    }
  } catch (e) { /* 用兜底版本 */ }

  // 2. 英雄列表
  let loaded = false;
  try {
    const r = await fetch(`${DDRAGON}/cdn/${ddVersion}/data/zh_CN/champion.json`, { cache:'force-cache' });
    if (r.ok) {
      const j = await r.json();
      allChamps = Object.values(j.data).map(c => ({
        id: c.id,
        key: c.key,          // Riot 数字 ID，桌面版用它匹配 LCU 的 championId
        // 注意：Data Dragon 中文数据里 title 才是英雄名（如「提莫」），name 是称号（如「迅捷斥候」）
        name: c.title || c.name,
        title: c.name || '',
        tags: (c.tags || []).map(t => t.toLowerCase()),
        info: c.info || {}
      }));
      loaded = allChamps.length > 0;
    }
  } catch (e) { /* 走兜底 */ }

  // 失败兜底：内置精简列表（保证功能可用）
  if (!loaded) {
    allChamps = FALLBACK_CHAMPS.map(c => ({
      id: c[0],
      name: c[2],      // 英雄名
      title: c[1],     // 称号
      tags: c[3].split(','), info: {}
    }));
    toast('英雄数据用内置列表（网络受限）');
  }

  // 3. 装备图标索引（异步，不阻塞）
  loadItemIndex();

  // 建立 Riot 数字 ID → 英雄 的索引（桌面版自动识别用）
  champByKey = {};
  allChamps.forEach(c => { if (c.key) champByKey[String(c.key)] = c; });

  renderChampList();
  $('champCount').textContent = `${allChamps.length} 位英雄`;
  $('patchPill').textContent = PATCH_LABEL;
  restoreLastPick();

  // 若桌面版已收到英雄，数据就绪后补一次识别
  if (hexElectron) applyDetectedChampion(hexElectron);
}

async function loadItemIndex() {
  try {
    const r = await fetch(`${DDRAGON}/cdn/${ddVersion}/data/zh_CN/item.json`, { cache:'force-cache' });
    if (!r.ok) return;
    const j = await r.json();
    const map = {};
    Object.entries(j.data).forEach(([id, it]) => {
      if (it.name) map[it.name] = { id, file: it.image ? it.image.full : '' };
    });
    itemIndex = map;
    if (currentChamp) renderDetail(currentChamp);
  } catch (e) { /* 忽略，用文字占位 */ }
}

function renderRoleRow() {
  const roles = ['fighter','tank','mage','marksman','assassin','support'];
  $('roleRow').innerHTML = roles.map(r =>
    `<span class="role-chip" data-role="${r}">${ROLE_LABEL[r]}</span>`
  ).join('') + `<span class="role-chip" data-role="__clear">清空</span>`;

  $('roleRow').addEventListener('click', e => {
    const chip = e.target.closest('.role-chip');
    if (!chip) return;
    const r = chip.dataset.role;
    if (r === '__clear') { activeRoles.clear(); }
    else if (activeRoles.has(r)) { activeRoles.delete(r); }
    else { activeRoles.add(r); }
    syncRoleChips();
    renderChampList();
  });
}

function syncRoleChips() {
  document.querySelectorAll('.role-chip').forEach(c => {
    const r = c.dataset.role;
    c.classList.toggle('on', r !== '__clear' && activeRoles.has(r));
  });
}

function filteredChamps() {
  const kw = searchKW.trim().toLowerCase();
  return allChamps.filter(c => {
    // 定位筛选
    if (activeRoles.size && !c.tags.some(t => activeRoles.has(t))) return false;
    if (!kw) return true;
    if (c.name.includes(kw)) return true;
    if (c.title && c.title.includes(kw)) return true;
    if (c.id.toLowerCase().includes(kw)) return true;
    if (pinyinHead(c.name).includes(kw)) return true;
    return false;
  });
}

function renderChampList() {
  const list = filteredChamps();
  const grid = $('champGrid');
  $('listCount').textContent = list.length ? `${list.length} 个结果` : '';
  $('listHint').textContent = (activeRoles.size || searchKW) ? '筛选结果' : '全部英雄';

  if (!list.length) {
    grid.innerHTML = `<div style="grid-column:1/-1;padding:26px 10px;text-align:center;color:var(--text3);font-size:13px">没有匹配的英雄</div>`;
    return;
  }

  grid.innerHTML = list.map(c => `
    <div class="champ-item ${currentChamp && currentChamp.id === c.id ? 'sel' : ''}"
         data-id="${c.id}" title="${c.name} · ${c.title || ''}">
      <span class="cph">${c.name.slice(0, 1)}</span>
      <img src="${champImg(c.id)}" alt="${c.name}" loading="lazy" decoding="async"
           data-cid="${c.id}" onerror="imgFallback(this)">
      <div class="cname">${c.name}</div>
    </div>
  `).join('');

  grid.onclick = e => {
    const item = e.target.closest('.champ-item');
    if (!item) return;
    const c = allChamps.find(x => x.id === item.dataset.id);
    if (c) selectChamp(c);
  };
}

/* ═══════════════════════════════════════════════════
   六、推荐引擎
   ═══════════════════════════════════════════════════ */
function scoreHex(hex, champ) {
  let score = RATING_SCORE[hex.rating] || 60;
  const tags = champ.tags || [];

  const isExclusive = !!(hex.champs && hex.champs.includes(champ.id));
  const roleMatch = !!(hex.roles && hex.roles.some(r => tags.includes(r)));
  const roleConflict = !!(hex.roles && hex.roles.length && !roleMatch);

  if (isExclusive) score += 70;          // 英雄专属契合
  if (roleMatch) score += 32;            // 定位匹配
  else if (roleConflict) score -= 30;    // 定位不符
  if (hex.hot) score += 4;               // 版本热门微调

  return { score, isExclusive, roleMatch };
}

function recommendHexes(champ) {
  const scored = HEXES.map(h => {
    const s = scoreHex(h, champ);
    return { ...h, ...s };
  }).sort((a, b) => b.score - a.score);

  // 每个品质取前 5，且过滤掉明显不适配的
  const byTier = {};
  Object.keys(HEX_TIERS).forEach(t => { byTier[t] = []; });
  for (const h of scored) {
    if (byTier[h.tier].length >= 5) continue;
    if (h.score < 55) continue;
    byTier[h.tier].push(h);
  }
  return byTier;
}

function recommendBuild(champ) {
  const custom = CHAMP_BUILDS[champ.id];
  if (custom) return { ...custom, isCustom: true };
  const tags = champ.tags || [];
  // 按 tags 顺序找第一个有预设的定位
  for (const t of tags) {
    if (ROLE_BUILDS[t]) return { ...ROLE_BUILDS[t], isCustom: false };
  }
  return { ...ROLE_BUILDS.fighter, isCustom: false };
}

}

function itemImgFallback(img) {
  const file = img.dataset.file;
  if (!img.dataset.fb && file) {
    img.dataset.fb = '1';

  } else {
    img.style.visibility = 'hidden';   // 保留占位尺寸，不至于塌陷
  }
}

function renderBuildLine(label, items, isCore) {
  if (!items || !items.length) return '';
  const html = items.map((name, i) => {
    const entry = itemIndex[name];
    let icon;
    if (entry && entry.id) {
      icon = `<img src="${TENCENT_CDN}/item/${entry.id}.png" alt="${name}" title="${name}"
                   data-file="${entry.file}" onerror="itemImgFallback(this)">`;
    } else {
      icon = `<div class="ph" title="${name}">◈</div>`;
    }
    const sep = (isCore && i < items.length - 1) ? '<span class="arrow">›</span>' : '';
    return `<div class="item ${isCore ? 'core' : ''}">${icon}<span>${name}</span></div>${sep}`;
  }).join('');
  return `<div class="build-line"><span class="build-line-label">${label}</span>${html}</div>`;
}

function randomPick() {
  if (!allChamps.length) return;
  const c = allChamps[Math.floor(Math.random() * allChamps.length)];
  selectChamp(c);
  toast(`随机到：${c.name}`);

  const el = document.querySelector(`.champ-item[data-id="${c.id}"]`);
  if (el) el.scrollIntoView({ block:'nearest', behavior:'smooth' });
}

function restoreLastPick() {
  const last = localStorage.getItem('hex.lastChamp');
  if (!last) return;
  const c = allChamps.find(x => x.id === last);
  if (c) selectChamp(c);
}

function bindUI() {
  const input = $('searchInput');
  let tid = null;
  input.addEventListener('input', () => {
    clearTimeout(tid);
    tid = setTimeout(() => {
      searchKW = input.value;
      renderChampList();
    }, 130);
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Escape') { input.value = ''; searchKW = ''; renderChampList(); }
    if (e.key === 'Enter') {
      const list = filteredChamps();
      if (list.length) selectChamp(list[0]);
    }
  });

  $('randomBtnEmpty').addEventListener('click', randomPick);

  document.addEventListener('keydown', e => {
    if (e.key === 'r' && !e.ctrlKey && !e.metaKey && document.activeElement !== input) {
      randomPick();
    }
  });
}

/* ═══════════════════════════════════════════════════
   九、桌面版（Electron）集成
   仅在 Electron 环境生效；纯网页打开时整段自动跳过
   ═══════════════════════════════════════════════════ */
function initElectron() {
  const api = window.hexAPI;
  if (!api || !api.isElectron) return;

  document.body.classList.add('electron');

  api.onState(onMainState);
  api.getState().then(onMainState).catch(() => {});

  const $id = id => document.getElementById(id);

  $id('btnMin').addEventListener('click', () => api.minimize());
  $id('btnQuit').addEventListener('click', () => api.quit());
  $id('btnClickThrough').addEventListener('click', () => api.toggleClickThrough());
  $id('btnAutoAccept').addEventListener('click', () => api.toggleAutoAccept());
  $id('btnReconnect').addEventListener('click', async () => {
    const ok = await api.reconnect();
    toast(ok ? '已连接英雄联盟客户端' : '未检测到客户端，请确认已登录');
  });
}

/** 主进程状态回调 */
function onMainState(s) {
  hexElectron = s;

  const dot = document.getElementById('connDot');
  const phase = document.getElementById('tbPhase');
  const msg = document.getElementById('tbMsg');
  const champTag = document.getElementById('tbChamp');
  const autoBtn = document.getElementById('btnAutoAccept');
  const autoSwitch = document.getElementById('autoAcceptSwitch');
  const throughBtn = document.getElementById('btnClickThrough');

  if (dot) dot.classList.toggle('on', !!s.lcuConnected);
  if (phase) phase.textContent = s.phaseText || '未连接客户端';

  // 状态消息：自动接受计数 / 错误提示
  if (msg) {
    if (s.message) msg.textContent = s.message;
    else if (s.acceptCount > 0) msg.textContent = `已自动接受 ${s.acceptCount} 次`;
    else msg.textContent = s.lcuConnected ? '' : '请先启动并登录英雄联盟客户端';
  }

  if (autoSwitch) autoSwitch.classList.toggle('on', !!s.autoAccept);
  if (autoBtn) {
    autoBtn.classList.toggle('active', !!s.autoAccept);
    autoBtn.title = s.autoAccept
      ? `自动接受已开启${s.acceptCount ? `（累计 ${s.acceptCount} 次）` : ''} · Ctrl+Shift+A 关闭`
      : '自动接受对局（Ctrl+Shift+A 切换）';
  }

  if (throughBtn) throughBtn.classList.toggle('warn-active', !!s.clickThrough);
  document.body.classList.toggle('click-through', !!s.clickThrough);

  if (champTag) {
    if (s.autoAcceptBusy) {
      champTag.textContent = '正在接受对局…';
      champTag.classList.add('show');
    } else {
      applyDetectedChampion(s);
    }
  }
}

/** 把主进程识别到的英雄同步到界面 */
function applyDetectedChampion(s) {
  if (!s) return;
  const tag = document.getElementById('tbChamp');
  if (!allChamps.length) return;

  let champ = null;
  if (s.championName) {
    // 游戏内 Live API 给的是英文 ID（与 Data Dragon 一致）
    champ = allChamps.find(c => c.id === s.championName) || null;
  } else if (s.championId) {
    // 选人阶段 LCU 给的是数字 ID
    champ = champByKey[String(s.championId)] || null;
  }

  if (!champ) {
    if (tag && !s.autoAcceptBusy) tag.classList.remove('show');
    return;
  }

  if (tag && !s.autoAcceptBusy) {
    tag.textContent = `${s.championSource === 'live' ? '游戏中' : '已选中'}：${champ.name}`;
    tag.classList.add('show');
  }

  // 英雄变化时自动切换推荐（不打扰手动浏览）
  if (!currentChamp || currentChamp.id !== champ.id) {
    selectChamp(champ);
    const el = document.querySelector(`.champ-item[data-id="${champ.id}"]`);
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

/* ═══════════════════════════════════════════════════
   十、启动
   ═══════════════════════════════════════════════════ */
function init() {
  renderRoleRow();
  bindUI();
  initElectron();
  loadData();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
