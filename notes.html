// ═══════════════════════════════════════
// 和风天气
// ═══════════════════════════════════════
// ═══════════════════════════════════════
// 天气（Open-Meteo 公开气象 API · 免费 · 免 Key · CORS 友好）
// ═══════════════════════════════════════

// WMO 天气代码 → 中文描述
const WMO_DESC = {
    0: '晴', 1: '大致晴朗', 2: '局部多云', 3: '阴',
    45: '雾', 48: '霜雾',
    51: '毛毛雨', 53: '小雨', 55: '中雨',
    56: '冻毛毛雨', 57: '强冻毛毛雨',
    61: '小雨', 63: '中雨', 65: '大雨',
    66: '冻雨', 67: '强冻雨',
    71: '小雪', 73: '中雪', 75: '大雪', 77: '雪粒',
    80: '阵雨', 81: '强阵雨', 82: '剧烈阵雨',
    85: '阵雪', 86: '强阵雪',
    95: '雷暴', 96: '雷暴伴冰雹', 99: '雷暴伴大冰雹'
};

async function initWeather() {
    setWeatherLoading(true);
    try {
        const pos = await getCurrentPosition();
        await fetchWeather(pos.lat, pos.lon);
    } catch (e) {
        showWeatherError(e.message || '获取天气失败');
    }
    setWeatherLoading(false);
}

async function refreshWeather() {
    const btn = document.querySelector('.weather-refresh');
    if (btn) btn.classList.add('spin');
    sessionStorage.removeItem('weather_location'); // 强制重新定位
    await initWeather();
    if (btn) setTimeout(() => btn.classList.remove('spin'), 800);
}

function getCurrentPosition() {
    return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
            reject(new Error('浏览器不支持地理定位'));
            return;
        }
        // 10 分钟缓存位置
        const cached = sessionStorage.getItem('weather_location');
        if (cached) {
            try {
                const pos = JSON.parse(cached);
                if (Date.now() - pos.ts < 600000) { resolve(pos); return; }
            } catch {}
        }
        navigator.geolocation.getCurrentPosition(
            pos => {
                const loc = {
                    lat: +pos.coords.latitude.toFixed(2),
                    lon: +pos.coords.longitude.toFixed(2),
                    ts: Date.now()
                };
                sessionStorage.setItem('weather_location', JSON.stringify(loc));
                resolve(loc);
            },
            () => reject(new Error('请允许浏览器获取位置权限以显示天气')),
            { timeout: 8000, maximumAge: 300000 }
        );
    });
}

async function fetchWeather(lat, lon) {
    const card = document.getElementById('weatherCard');

    // 1) 反向地理 → 获取省/市/区（BigDataCloud 免费 API，无需 Key，CORS 友好）
    let cityName = `${lat}°, ${lon}°`;
    try {
        const geoUrl = `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh`;
        const geoRes = await fetch(geoUrl);
        if (geoRes.ok) {
            const geo = await geoRes.json();
            const parts = [];
            if (geo.principalSubdivision) parts.push(geo.principalSubdivision); // 省
            if (geo.city) parts.push(geo.city);                                   // 市
            if (geo.locality && geo.locality !== geo.city) parts.push(geo.locality); // 区
            cityName = parts.length ? parts.join(' ') : (geo.city || geo.principalSubdivision || cityName);
        }
    } catch {}

    // 2) 实况 + 未来 7 日预报（取前 3 日展示）
    const fcUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
        `&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m,wind_direction_10m,visibility` +
        `&daily=weather_code,temperature_2m_max,temperature_2m_min` +
        `&timezone=auto&wind_speed_unit=kmh`;
    const fcRes = await fetch(fcUrl);
    if (!fcRes.ok) throw new Error('天气服务响应失败（' + fcRes.status + '）');
    const data = await fcRes.json();
    if (!data.current || !data.daily) throw new Error('天气数据格式异常');

    const cur = data.current;
    const daily = data.daily;
    const isDay = cur.is_day === 1;
    const wcode = cur.weather_code;
    const desc = WMO_DESC[wcode] || '未知';
    const icon = getWeatherEmoji(wcode, isDay);
    const wclass = getWeatherClass(wcode, isDay);
    const wind = `${getWindDir(cur.wind_direction_10m)} ${Math.round(cur.wind_speed_10m)}km/h`;

    card.className = 'weather-card ' + wclass;
    card.innerHTML = `
        <div class="weather-place">📍 ${escHtml(cityName)}</div>
        <div class="weather-temp">${Math.round(cur.temperature_2m)}<sup>°C</sup></div>
        <div class="weather-desc">${desc} · 体感 ${Math.round(cur.apparent_temperature)}°C</div>
        <div class="weather-icon">${icon}</div>
        <div class="weather-detail">
            <span>💧 ${cur.relative_humidity_2m}%</span>
            <span>💨 ${wind}</span>
            <span>👁 ${Math.round(cur.visibility / 1000)}km</span>
        </div>
        <button class="weather-refresh" onclick="refreshWeather()" title="刷新天气">↻</button>`;

    // 3) 三日预报
    const fcHtml = daily.time.slice(0, 3).map((d, i) => {
        const dt = new Date(d + 'T00:00:00');
        const dayLabel = i === 0 ? '今天' : `${dt.getMonth() + 1}/${dt.getDate()}`;
        return `<div class="fc-day">
            <div class="fc-icon">${getWeatherEmoji(daily.weather_code[i], 1)}</div>
            <div class="fc-temp">${Math.round(daily.temperature_2m_min[i])}°/${Math.round(daily.temperature_2m_max[i])}°</div>
            <div>${dayLabel}</div>
        </div>`;
    }).join('');
    document.getElementById('weatherForecast').innerHTML = fcHtml;
}

function setWeatherLoading(loading) {
    const card = document.getElementById('weatherCard');
    card.classList.toggle('loading', loading);
}

function showWeatherError(msg) {
    const card = document.getElementById('weatherCard');
    card.className = 'weather-card';
    card.innerHTML = `
        <div class="weather-place">📍 天气</div>
        <div class="weather-error">
            <div style="font-size:32px;margin-bottom:8px;">🌤</div>
            <div>${escHtml(msg)}</div>
        </div>
        <button class="weather-refresh" onclick="refreshWeather()" title="刷新天气">↻</button>`;
    document.getElementById('weatherForecast').innerHTML = '';
}

function getWeatherEmoji(code, isDay) {
    if (code === 0) return isDay ? '☀️' : '🌙';
    if (code <= 2) return isDay ? '🌤' : '🌙';
    if (code === 3) return '☁️';
    if (code <= 48) return '🌫';
    if (code <= 57) return '🌦';
    if (code <= 67) return '🌧';
    if (code <= 77) return '❄️';
    if (code <= 82) return '⛈';
    if (code <= 86) return '🌨';
    return '⛈';
}

function getWindDir(deg) {
    const dirs = ['北', '东北', '东', '东南', '南', '西南', '西', '西北'];
    return dirs[Math.round(deg / 45) % 8];
}

function getWeatherClass(code, isDay) {
    if (!isDay) return 'night';
    if (code <= 1) return 'clear';
    if (code === 3 || code <= 48) return 'cloudy';
    if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return 'rain';
    if ((code >= 71 && code <= 86) || code === 77) return 'snow';
    return 'clear';
}

// ═══════════════════════════════════════
// 智能家居
// ═══════════════════════════════════════
function toggleSmartHome(brand) {
    const info = {
        mijia: { name: '米家', color: '#FF6700', desc: '需配置米家账号和 API 凭证。支持灯光、开关、窗帘、传感器等设备。' },
        midea: { name: '美的', color: '#00A3E0', desc: '需配置美的美居账号。支持空调、冰箱、洗衣机等设备。' },
        ronshen: { name: '容声', color: '#2E86C1', desc: '需配置容声智能平台凭证。支持冰箱温度监控、模式切换。' },
        haier: { name: '海尔', color: '#0066CC', desc: '需配置海尔智家账号。支持冰箱、洗衣机、空调、热水器。' }
    };
    const d = info[brand];
    document.getElementById('smartHomeInfo').innerHTML = `
        <div style="background:var(--surface2);border-radius:var(--radius-sm);padding:16px;text-align:left;">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
                <span style="width:24px;height:24px;border-radius:6px;background:${d.color};display:inline-block;"></span>
                <strong>${d.name} 连接配置</strong>
            </div>
            <p style="font-size:12px;color:var(--text2);margin:0 0 10px;">${d.desc}</p>
            <input type="text" placeholder="输入 API Key / Token" style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius-xs);font-size:12px;background:var(--surface);color:var(--text);box-sizing:border-box;margin-bottom:6px;">
            <button style="padding:6px 14px;border:none;background:${d.color};color:#fff;border-radius:var(--radius-xs);cursor:pointer;font-size:12px;" onclick="toast('${d.name} 连接功能开发中，敬请期待')">连接</button>
        </div>`;
}

document.addEventListener('click', function(e) {
    if (!e.target.closest('.home-brand-card') && !e.target.closest('#smartHomeInfo')) {
        const el = document.getElementById('smartHomeInfo');
        if (el && !el.querySelector('input, button')) return;
        el.innerHTML = '🔌 点击品牌卡片配置连接凭证';
    }
});
</script>
</body>
</html>
